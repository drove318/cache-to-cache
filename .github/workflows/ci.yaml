# the matrix of the forge: cpu arm64 and x86-64, gpu off and on, py 3.10 up
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel_in_progress: true

jobs:

  lint:
    name: the lint, on the tin
    runs_on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[train]
      - run: python -m pip install ruff mypy
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/c2c --ignore-missing-imports
      - run: python tools/import_smoke.py            # no torch, no network
      - run: python tools/dunder_lint.py
      - run: python tools/api_lint.py
      - run: python tools/attr_probe.py

  test:
    name: py${{ matrix.python }} ${{ matrix.os }} ${{ matrix.arch }} gpu-${{ matrix.gpu }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-24.04]
        arch: [arm64, x86-64]
        gpu: [false]
        include:
          # the gpu leg of the matrix: one python, both arches where offered
          - python: "3.12"
            os: ubuntu-24.04-gpu
            arch: x86-64
            gpu: true
          - python: "3.12"
            os: ubuntu-24.04-gpu
            arch: arm64
            gpu: true
    runs-on: ${{ matrix.os }}
    container:
      # the arm64 runners, where the native wheels allow
      image: ${{ matrix.arch == 'arm64' && 'python:${{ matrix.python }}-slim-bookworm' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: the wheels, on the correct index
        run: |
          python -m pip install --upgrade pip
          if '${{ matrix.gpu }}' = 'true'; then
              python -m pip install .[gpu]           # the cuda build, on the gpu runner
          else
              python -m pip install .[train]          # the cpu build, for every runner
          fi
          python -m pip install pytest
      - name: the doctor, before the tests
        run: python -m c2c.cli.main doctor --report
      - name: the unit suite, on the cpu, in seconds
        # the golden suite is honest: it skips what the machine cannot run
        run: python -m pytest tests/ --tb=short --maxfail=20
        env:
          C2C_SEED: "440"                            # the die of the house, cast once
      - name: the smoke of the served, on the port
        run: |
          python -m pytest tests/test_serve_smoke.py -k "proxy" --tb=short
      - name: the report, if the tests did fail
        if: failure()
        run: python -m c2c.cli.main doctor --report

  package:
    name: the distribution, built
    needs: test
    runs_on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/

  release:
    name: the publish, to the shop
    if: startsWith(github.ref_name, 'v')
    needs: package
    runs_on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/
      - run: python -m pip install twine
      - run: python -m twine upload --non-interactive --repository pypi dist/*
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
